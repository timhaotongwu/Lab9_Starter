<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>

  <style>
    button {
      margin: 3px;
    }

    button:hover {
      cursor: pointer;
    }

    #first-num,
    #second-num {
      width: 60px;
    }

    output {
      border: 1px solid gray;
      display: block;
      height: 18px;
      margin-top: 5px;
      padding: 5px;
      width: 240px;
    }

    main {
      width: 800px;
    }

    #error-btns {
      column-gap: 5px;
      display: flex;
      flex-wrap: wrap;
      margin-top: 30px;
      row-gap: 5px;
    }

    #error-btns>* {
      padding: 8px 2px;
      width: 122px;
    }
  </style>
  <script src="https://cdn.trackjs.com/agent/v3/latest/t.js"></script>
<script>
  window.TrackJS && TrackJS.install({
    token: "8b52a3f7011a4f41b5cff2594e0d0c2b",
    application: "lab9-error-demo"
  });
</script>
</head>

<body>
  <main>
    <form>
      <fieldset>
        <legend>Error Calculator</legend>
        <input name="first-num" id="first-num" />
        <select name="operator" id="operator">
          <option>+</option>
          <option>-</option>
          <option>*</option>
          <option>/</option>
        </select>
        <input name="second-num" id="second-num" />
        <button id="calculate">Calculate</button>
        <br />
        <output></output>
      </fieldset>
    </form>

    <section id="error-btns">
      <button>Console Log</button>
      <button>Console Error</button>
      <button>Console Count</button>
      <button>Console Warn</button>
      <button>Console Assert</button>
      <button>Console Clear</button>
      <button>Console Dir</button>
      <button>Console dirxml</button>
      <button>Console Group Start</button>
      <button>Console Group End</button>
      <button>Console Table</button>
      <button>Start Timer</button>
      <button>End Timer</button>
      <button>Console Trace</button>
      <button>Trigger a Global Error</button>
    </section>
  </main>

  <script>
  let form = document.querySelector('form');
  let errorBtns = Array.from(document.querySelectorAll('#error-btns > button'));

  class CalculatorInputError extends Error {
    constructor(message) {
      super(message);
      this.name = "CalculatorInputError";
    }
  }

  // Global Error Handler
  window.onerror = function (message, source, lineno, colno, error) {
    console.log("Global error caught:", message);
    return false;
  };

  // Console Log
  errorBtns[0].addEventListener("click", () => {
    console.log("Console log demo: button clicked.");
  });

  // Console Error
  errorBtns[1].addEventListener("click", () => {
    console.error("Console error demo.");
  });

  // Console Count
  errorBtns[2].addEventListener("click", () => {
    console.count("Button clicked");
  });

  // Console Warn
  errorBtns[3].addEventListener("click", () => {
    console.warn("Console warning demo.");
  });

  // Console Assert
  errorBtns[4].addEventListener("click", () => {
    console.assert(2 + 2 === 5, "Assertion failed: 2 + 2 is not 5.");
  });

  // Console Clear
  errorBtns[5].addEventListener("click", () => {
    console.clear();
  });

  // Console Dir
  errorBtns[6].addEventListener("click", () => {
    console.dir(document.querySelector("main"));
  });

  // Console DirXML
  errorBtns[7].addEventListener("click", () => {
    console.dirxml(document.querySelector("main"));
  });

  // Console Group Start
  errorBtns[8].addEventListener("click", () => {
    console.group("Calculator Information");
    console.log("First Number Input");
    console.log("Second Number Input");
    console.log("Operator Selector");
  });

  // Console Group End
  errorBtns[9].addEventListener("click", () => {
    console.groupEnd();
  });

  // Console Table
  errorBtns[10].addEventListener("click", () => {
    console.table([
      {
        field: "First Number",
        value: document.querySelector("#first-num").value
      },
      {
        field: "Operator",
        value: document.querySelector("#operator").value
      },
      {
        field: "Second Number",
        value: document.querySelector("#second-num").value
      }
    ]);
  });

  // Start Timer
  errorBtns[11].addEventListener("click", () => {
    console.time("CalculationTimer");
    console.log("Timer started.");
  });

  // End Timer
  errorBtns[12].addEventListener("click", () => {
    console.timeEnd("CalculationTimer");
  });

  // Console Trace
  errorBtns[13].addEventListener("click", () => {
    console.trace("Trace demo");
  });

  // Trigger Global Error
  errorBtns[14].addEventListener("click", () => {
    nonExistentFunction();
  });

  // Calculator with try/catch/finally and custom errors
  form.addEventListener('submit', e => {
    e.preventDefault();

    let output = document.querySelector('output');
    let firstNum = document.querySelector('#first-num').value;
    let secondNum = document.querySelector('#second-num').value;
    let operator = document.querySelector('#operator').value;

    try {
      if (firstNum.trim() === "" || secondNum.trim() === "") {
        throw new CalculatorInputError(
          "Both input fields are required."
        );
      }

      if (
        isNaN(Number(firstNum)) ||
        isNaN(Number(secondNum))
      ) {
        throw new CalculatorInputError(
          "Inputs must be valid numbers."
        );
      }

      if (
        operator === "/" &&
        Number(secondNum) === 0
      ) {
        throw new CalculatorInputError(
          "Division by zero is not allowed."
        );
      }

      output.innerHTML =
        eval(`${firstNum} ${operator} ${secondNum}`);

    } catch (error) {
      console.error(
        `${error.name}: ${error.message}`
      );

      output.innerHTML =
        `Error: ${error.message}`;

    } finally {
      console.log(
        "Calculation attempt finished."
      );
    }
  });
</script>
</body>

</html>
